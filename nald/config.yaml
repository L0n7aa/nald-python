# python -m nald.cli run config.yaml
run:
  name: kg_reference
  seed: 12345            
  n_runs: 1
  interactive: false
  # output_dir: Data     

model:
  type: kremer_grest
  kremer_grest:
    n_molecules: 50
    n_atoms: 50
    temperature: 1
    density: 0.1         

lammps:
  executable: null

executor:
  n_procs: 1
  max_parallel_jobs: 1